name: Test multiple Conda variants

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  multiple-python-variants:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Conda
        uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-name: action-test
          create-args: >-
            python=3.13
            conda-build
            anaconda-client
          condarc: |
            channels:
              - conda-forge
            channel_priority: strict

      - name: Build all variants
        id: build
        uses: ./
        with:
          meta_yaml_dir: tests/fixtures/multiple-python-variants
          upload: false
          # conda convert does not support the modern .conda archive format.
          conda_build_args: --no-test --package-format 1
          platform_linux-64: ${{ runner.os != 'Linux' }}
          platform_osx-64: true
          platform_osx-arm64: true
          platform_win-64: ${{ runner.os != 'Windows' }}
          evidence_matrix_index: ${{ strategy.job-index }}

      - name: Verify both variants
        shell: bash -el {0}
        env:
          BUILT_PATHS: ${{ steps.build.outputs.built_paths }}
        run: |
          set -euo pipefail
          read -r -a built_paths <<< "$BUILT_PATHS"
          if [[ "${#built_paths[@]}" -ne 8 ]]; then
            echo "Expected eight built packages, found ${#built_paths[@]}: $BUILT_PATHS"
            exit 1
          fi
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            host_platform=win-64
          else
            host_platform=linux-64
          fi
          test_root="$(mktemp -d -t variant-tests-XXXXXXXXXX)"
          index=0
          for package_path in "${built_paths[@]}"; do
            test -f "$package_path"
            platform="$(basename "$(dirname "$package_path")")"
            if [[ "$platform" != "$host_platform" ]]; then
              continue
            fi
            test_prefix="$test_root/env-$index"
            if [[ "$package_path" == *"py311"* ]]; then
              python_version=3.11
            else
              python_version=3.12
            fi
            conda create --yes --prefix "$test_prefix" "python=$python_version"
            conda install --yes --prefix "$test_prefix" "$package_path"
            conda run --prefix "$test_prefix" python -c "import action_multiple_variants_fixture"
            index=$((index + 1))
          done
          test "$index" -eq 2
          declare -A platform_counts=()
          for package_path in "${built_paths[@]}"; do
            platform="$(basename "$(dirname "$package_path")")"
            platform_counts[$platform]=$(( ${platform_counts[$platform]:-0} + 1 ))
          done
          for platform in linux-64 osx-64 osx-arm64 win-64; do
            test "${platform_counts[$platform]:-0}" -eq 2
          done
          [[ "$BUILT_PATHS" == *"py311"* ]]
          [[ "$BUILT_PATHS" == *"py312"* ]]

      - name: Verify structured producer evidence
        shell: bash
        env:
          EVIDENCE_PATH: ${{ steps.build.outputs.evidence_path }}
        run: |
          python -c "import json, os, pathlib; path=pathlib.Path(os.environ['EVIDENCE_PATH']); assert path.name == 'gh-run-receptor-events.json'; value=json.loads(path.read_text()); assert value['schema'] == 'gh-run-receptor.events@1'; assert value['producer']['repository']; assert value['producer']['ref']; assert len(value['events']) == 8; assert {event['platform'] for event in value['events']} == {'linux-64', 'osx-64', 'osx-arm64', 'win-64'}; assert all(event['upload'] == 'not_requested' for event in value['events'])"

      - name: Upload structured producer evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ steps.build.outputs.evidence_artifact_name }}
          path: ${{ steps.build.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 7
