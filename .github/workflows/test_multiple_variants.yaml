name: Test multiple Conda variants

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  multiple-python-variants:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Conda
        uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-name: action-test
          create-args: >-
            python=3.13
            conda-build
            anaconda-client
          condarc: |
            channels:
              - conda-forge
            channel_priority: strict

      - name: Build all variants
        id: build
        uses: ./
        with:
          meta_yaml_dir: tests/fixtures/multiple-python-variants
          upload: false
          conda_build_args: --no-test

      - name: Verify both variants
        shell: bash -el {0}
        env:
          BUILT_PATHS: ${{ steps.build.outputs.built_paths }}
        run: |
          set -euo pipefail
          read -r -a built_paths <<< "$BUILT_PATHS"
          if [[ "${#built_paths[@]}" -ne 2 ]]; then
            echo "Expected two built packages, found ${#built_paths[@]}: $BUILT_PATHS"
            exit 1
          fi
          test_root="$(mktemp -d -t variant-tests-XXXXXXXXXX)"
          index=0
          for package_path in "${built_paths[@]}"; do
            test -f "$package_path"
            test_prefix="$test_root/env-$index"
            if [[ "$package_path" == *"py311"* ]]; then
              python_version=3.11
            else
              python_version=3.12
            fi
            conda create --yes --prefix "$test_prefix" "python=$python_version"
            conda install --yes --prefix "$test_prefix" "$package_path"
            conda run --prefix "$test_prefix" python -c "import action_multiple_variants_fixture"
            index=$((index + 1))
          done
          [[ "$BUILT_PATHS" == *"py311"* ]]
          [[ "$BUILT_PATHS" == *"py312"* ]]
